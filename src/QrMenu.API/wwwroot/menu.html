<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menü</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        #header {
            background: #0F6E56;
            color: white;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        #rest-name {
            font-size: 17px;
            font-weight: 600;
        }

        #table-info {
            font-size: 12px;
            opacity: 0.75;
            margin-top: 3px;
        }

        .lang-btn {
            background: transparent;
            color: rgba(255,255,255,0.6);
            border: none;
            padding: 4px 9px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
        }

            .lang-btn.active {
                background: rgba(255,255,255,0.25);
                color: white;
            }

        #cats {
            display: flex;
            gap: 8px;
            padding: 10px 12px;
            overflow-x: auto;
            background: white;
            border-bottom: 1px solid #eee;
            scrollbar-width: none;
            position: sticky;
            top: 54px;
            z-index: 9;
        }

            #cats::-webkit-scrollbar {
                display: none;
            }

        .cat-btn {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid #ddd;
            background: transparent;
            color: #555;
            transition: all .15s;
        }

            .cat-btn.active {
                background: #E1F5EE;
                color: #085041;
                border-color: #0F6E56;
                font-weight: 500;
            }

        #items {
            background: white;
            min-height: 60vh;
        }

        .item {
            display: flex;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid #f0f0f0;
            align-items: flex-start;
        }

        .item-img {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            object-fit: cover;
            background: #f0f0f0;
            flex-shrink: 0;
        }

            .item-img.no-img {
                display: flex;
                align-items: center;
                justify-content: center;
                color: #ccc;
                font-size: 28px;
            }

        .item-name {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
            line-height: 1.3;
        }

        .item-desc {
            font-size: 12px;
            color: #777;
            margin-top: 4px;
            line-height: 1.5;
        }

        .item-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
        }

        .item-price {
            font-size: 15px;
            font-weight: 700;
            color: #1a1a1a;
        }

        .badges {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .badge {
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 8px;
            font-weight: 600;
        }

        .badge-popular {
            background: #FAECE7;
            color: #712B13;
        }

        .badge-new {
            background: #E1F5EE;
            color: #085041;
        }

        .badge-vegan {
            background: #EAF3DE;
            color: #27500A;
        }

        #loading {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 15px;
        }

        #error {
            text-align: center;
            padding: 60px 20px;
            color: #c00;
            font-size: 15px;
        }

        #footer {
            text-align: center;
            padding: 20px;
            font-size: 11px;
            color: #bbb;
            background: #fafafa;
            border-top: 1px solid #eee;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="header">
        <div>
            <div id="rest-name">Yükleniyor...</div>
            <div id="table-info"></div>
        </div>
        <div id="lang-switcher" style="display:flex;gap:3px;margin-top:2px"></div>
    </div>

    <div id="cats"></div>
    <div id="items"><div id="loading">Menü yükleniyor...</div></div>
    <div id="footer">qrmenu.com</div>

    <script src="/js/menu.js"></script>
</body>
</html>
